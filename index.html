<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Merge Margin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1><span aria-hidden="true">⋈</span> Merge Margin</h1>
      <div>
        <label class="import">Open session<input id="session" type="file" accept=".json" /></label
        ><button id="save-session" disabled>Save session</button>
      </div>
    </header>
    <main>
      <div class="command-bar">
        <label
          >Example
          <select id="example">
            <option value="independent">Independent edits</option>
            <option value="conflict">Overlapping changes</option>
            <option value="insertion">Competing insertions</option>
          </select></label
        ><button id="merge" class="primary">Compare</button>
      </div>
      <div class="source-tabs" aria-label="Visible source">
        <button data-source="base" aria-pressed="true">Base</button
        ><button data-source="ours" aria-pressed="false">Ours</button
        ><button data-source="theirs" aria-pressed="false">Theirs</button>
      </div>
      <section aria-label="Source documents"><div id="sources" class="columns"></div></section>
      <div class="status-strip">
        <p id="status" role="status" aria-live="polite"></p>
        <span>UTF-8 · 800 lines max.</span>
      </div>
      <section id="results" hidden>
        <aside class="resolution-pane">
          <div class="pane-heading">
            <h2>Conflicts</h2>
            <span id="stats"></span>
          </div>
          <div id="conflicts"></div>
        </aside>
        <div class="output-pane">
          <div class="pane-heading">
            <div class="result-tabs" role="tablist" aria-label="Output views">
              <button id="merged-tab" role="tab" aria-selected="true" aria-controls="merged-pane">
                Merged</button
              ><button
                id="changes-tab"
                role="tab"
                aria-selected="false"
                aria-controls="changes-pane"
                tabindex="-1"
              >
                Line changes
              </button>
            </div>
            <button id="save">Download text ↓</button>
          </div>
          <div id="merged-pane" role="tabpanel" aria-labelledby="merged-tab">
            <div class="output-status"><span id="remaining"></span></div>
            <pre id="output" tabindex="0" aria-label="Merged document"></pre>
          </div>
          <div id="changes-pane" role="tabpanel" aria-labelledby="changes-tab" hidden>
            <div class="diff-options">
              <label
                >Base →
                <select id="side">
                  <option value="ours">Ours</option>
                  <option value="theirs">Theirs</option>
                </select></label
              ><span>− Removed / + Inserted</span>
            </div>
            <div id="diff" class="diff" tabindex="0" aria-label="Line changes"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
